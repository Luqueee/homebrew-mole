# Keeps the formula and the cask on the latest releases of Luqueee/mole.
#
# The CLI is the newest vX.Y.Z tag; the app is the newest published
# desktop-vX.Y.Z release. They are versioned separately, so each is bumped on
# its own. The job only moves forward, and commits nothing when nothing changed.
name: bump

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump to the latest releases
        run: |
          set -eu
          newest() { sort -V | tail -1; }

          cli=$(gh api repos/Luqueee/mole/tags --paginate --jq '.[].name' | sed -n 's/^v\([0-9][0-9.]*\)$/\1/p' | newest)
          app=$(gh api repos/Luqueee/mole/releases --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sed -n 's/^desktop-v\([0-9][0-9.]*\)$/\1/p' | newest)
          have_cli=$(sed -n 's|^ *tag: *"v\([0-9.]*\)",$|\1|p' Formula/mole-tunnel.rb)
          have_app=$(sed -n 's/^  version "\([0-9.]*\)"$/\1/p' Casks/mole-tunnel.rb)
          echo "cli: ${have_cli} -> ${cli:-none} | app: ${have_app} -> ${app:-none}"

          newer() { [ -n "$1" ] && [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | newest)" = "$1" ]; }
          if newer "${cli}" "${have_cli}"; then sh scripts/bump.sh formula "${cli}"; fi
          if newer "${app}" "${have_app}"; then sh scripts/bump.sh cask "${app}"; fi

      - name: Commit
        run: |
          set -eu
          if git diff --quiet; then echo "nothing to bump"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bump to the latest mole release"
          git push
